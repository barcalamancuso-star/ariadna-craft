name = "ariadna-craft"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws", "/api/*"]

[[durable_objects.bindings]]
name = "WORLD_ROOM"
class_name = "VoxelWorldRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoxelWorldRoom"]
